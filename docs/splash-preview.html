<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Godsmash splash preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap">
<link rel="stylesheet" href="../css/styles.css">
<style>body{margin:0;background:#222} #frame{position:relative;width:390px;height:844px;overflow:hidden} #splash{position:absolute !important} #splash.hide{opacity:1;visibility:visible} .bar{position:absolute;z-index:2000;right:6px;top:6px;display:flex;gap:6px} .bar button{font:12px system-ui;padding:4px 8px}</style>
</head><body>
<!-- ?theme=red|blue  ?t=<ms> freezes the scene at that time  ?seed=<n> fixes the randomness. No t: plays live. -->
<div id="frame">
<div class="bar"><button onclick="go('red')">Replay red</button><button onclick="go('blue')">Replay blue</button></div>
<div id="splash" class="sp-red" data-nokb>
  <canvas id="sp3fx" aria-hidden="true"></canvas>
  <div class="sp3-brand">
    <img id="sp3logo" src="../icons/icon-512.png" width="120" height="120" alt="Godsmash">
    <div class="sp3-word">GODSMASH</div>
    <div id="splashSub" class="sp3-sub">Badminton Club</div>
  </div>
</div>
</div>
<script>
var Q = new URLSearchParams(location.search);
function go(th) { location.search = "?theme=" + th; }
if (Q.get("theme") === "blue") document.getElementById("splash").className = "sp-blue";
</script>
<script src="../js/splash.js"></script>
<script>
if (Q.get("t") !== null) setTimeout(function () { spSeek(+Q.get("t")); }, 700);
</script>
</body></html>
