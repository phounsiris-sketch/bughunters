<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0d9488">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/styles.css">
<title>Godsmash</title>
</head>
<body data-theme="dark">

<!-- ==================== AUTH CONTAINER ==================== -->
<div id="auth-container">
  <div id="login-page" class="login-page">
    <div class="login-logo"><iconify-icon icon="solar:shuttlecock-bold" width="64"></iconify-icon></div>
    <div class="login-title">Godsmash</div>
    <div class="login-subtitle">Badminton booking &amp; cost splitting</div>
    <div class="login-form">
      <div class="form-group">
        <input type="email" class="form-input" id="loginEmail" autocomplete="email" inputmode="email"
               placeholder="Enter your email" data-i18n-placeholder="enterEmail">
      </div>
      <button class="btn-primary" id="sendLinkBtn" onclick="sendLoginLink()" data-i18n="sendLink">Send Sign-In Link</button>
      <div id="otpSentMsg" style="display:none;margin-top:12px;text-align:center;font-size:13px;color:var(--text-secondary)" data-i18n="checkEmail">Check your email for the sign-in link!</div>
    </div>
  </div>
  <div id="profile-page" class="profile-setup" style="display:none">
    <h2 data-i18n="profileSetup" style="text-align:center">Set Up Profile</h2>
    <div class="form-group" style="margin-top:20px">
      <label class="form-label" data-i18n="displayName">Display Name</label>
      <input class="form-input" id="profileName">
    </div>
    <div class="form-group">
      <label class="form-label" data-i18n="phone">Phone</label>
      <input class="form-input" id="profilePhone" placeholder="Optional">
    </div>
    <button class="btn-primary" onclick="saveProfile()" data-i18n="saveContinue">Save &amp; Continue</button>
  </div>
</div>

<!-- ==================== APP CONTAINER ==================== -->
<div id="app-container" style="display:none">

  <!-- Header -->
  <div class="app-header">
    <div class="header-top">
      <div style="display:flex;align-items:center">
        <button class="back-btn" id="backBtn" onclick="goBack()" style="display:none">
          <iconify-icon icon="solar:arrow-left-bold" width="22"></iconify-icon>
        </button>
        <span id="headerTitle" class="header-title">Godsmash</span>
      </div>
      <div class="header-controls">
        <button class="lang-toggle" onclick="toggleLang()" id="langBtn">EN</button>
        <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">&#9728;&#65039;</button>
      </div>
    </div>
    <div class="header-sub" id="headerSub">Book &amp; split in seconds</div>
  </div>

  <!-- Content -->
  <div class="content">

    <!-- PAGE: Polls -->
    <div class="page active" id="page-polls">
      <div id="pollsList"></div>
    </div>

    <!-- PAGE: Create Poll -->
    <div class="page" id="page-poll-create">
      <div id="pollCreateContent"></div>
    </div>

    <!-- PAGE: Sessions List -->
    <div class="page" id="page-sessions">
      <div id="sessionsList"></div>
    </div>

    <!-- PAGE: Session Detail -->
    <div class="page" id="page-session-detail">
      <div id="sessionDetailContent"></div>
    </div>

    <!-- PAGE: Dashboard -->
    <div class="page" id="page-dashboard">
      <div class="dashboard-tabs">
        <button class="dash-tab active" onclick="switchDashTab('balance')" id="tab-balance" data-i18n="balance">Balance</button>
        <button class="dash-tab" onclick="switchDashTab('spending')" id="tab-spending" data-i18n="spending">Spending</button>
        <button class="dash-tab" onclick="switchDashTab('activity')" id="tab-activity" data-i18n="activity">Activity</button>
      </div>
      <div class="period-toggle" id="periodToggle" style="display:none">
        <button class="period-btn active" onclick="setPeriod('monthly')" id="period-monthly" data-i18n="monthly">Monthly</button>
        <button class="period-btn" onclick="setPeriod('quarterly')" id="period-quarterly" data-i18n="quarterly">Quarterly</button>
        <button class="period-btn" onclick="setPeriod('yearly')" id="period-yearly" data-i18n="yearly">Yearly</button>
      </div>
      <div id="dashboardContent"></div>
    </div>

    <!-- PAGE: Settings -->
    <div class="page" id="page-settings">
      <div id="settingsContent"></div>
    </div>

  </div>

  <!-- Bottom Nav -->
  <div class="bottom-nav">
    <div class="nav-item active" onclick="showPage('polls')" id="nav-polls">
      <span class="nav-icon"><iconify-icon icon="solar:calendar-bold" width="22"></iconify-icon></span>
      <span data-i18n="navPolls">Polls</span>
    </div>
    <div class="nav-item" onclick="showPage('sessions')" id="nav-sessions">
      <span class="nav-icon"><iconify-icon icon="solar:clipboard-list-bold" width="22"></iconify-icon></span>
      <span data-i18n="navSessions">Sessions</span>
    </div>
    <div class="nav-item" onclick="showPage('dashboard')" id="nav-dashboard">
      <span class="nav-icon"><iconify-icon icon="solar:chart-square-bold" width="22"></iconify-icon></span>
      <span data-i18n="navDashboard">Dashboard</span>
    </div>
    <div class="nav-item" onclick="showPage('settings')" id="nav-settings">
      <span class="nav-icon"><iconify-icon icon="solar:settings-bold" width="22"></iconify-icon></span>
      <span data-i18n="navSettings">Settings</span>
    </div>
  </div>

  <!-- FAB -->
  <button class="fab" id="fab" onclick="showCreatePoll()">
    <iconify-icon icon="solar:add-circle-bold" width="28"></iconify-icon>
  </button>

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-title" id="modalTitle"></div>
    <div id="modalBody"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()" data-i18n="cancel">Cancel</button>
      <button class="btn-primary" onclick="modalConfirm()" id="modalConfirmBtn" style="width:auto;padding:10px 20px;" data-i18n="save">Save</button>
    </div>
  </div>
</div>

<!-- ==================== SCRIPTS ==================== -->
<!-- Firebase SDK (compat) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>

<!-- Icons -->
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>

<!-- Charts -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<!-- App -->
<script src="js/firebase-config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/router.js"></script>
<script src="js/db.js"></script>
<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/polls.js"></script>
<script src="js/sessions.js"></script>
<script src="js/dinner.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/settings.js"></script>
<script src="js/app.js"></script>

</body>
</html>
