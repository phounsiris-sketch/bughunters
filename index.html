<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0d9488">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/styles.css">
<title>Godsmash</title>
</head>
<body data-theme="dark">

<!-- Splash: shown until we know whether someone is signed in -->
<div id="splash" aria-live="polite">
  <div class="splash-logo">&#127992;</div>
  <div class="splash-name">Godsmash</div>
  <div class="splash-sub" id="splashSub">Badminton Club</div>
  <div class="splash-spinner"></div>
</div>


<!-- ==================== AUTH CONTAINER ==================== -->
<div id="auth-container">
  <div style="display:flex;justify-content:flex-end;gap:8px;padding:12px 16px 0">
    <button class="lang-toggle auth-toggle" onclick="toggleLang()" id="authLangBtn">LA</button>
  </div>
  <div id="login-page" class="login-page">
    <div class="login-logo" style="font-size:56px">&#127992;</div>
    <div class="login-title">Godsmash</div>
    <div class="login-subtitle" data-i18n="appTagline">Badminton booking &amp; cost splitting</div>
    <div class="login-form">
      <div class="dashboard-tabs" style="margin-bottom:20px">
        <button class="dash-tab active" id="authTabLogin" onclick="setAuthMode('login')" data-i18n="signIn">Sign in</button>
        <button class="dash-tab" id="authTabRegister" onclick="setAuthMode('register')" data-i18n="register">Register</button>
      </div>
      <form onsubmit="event.preventDefault();submitAuth()">
        <div id="registerFields" style="display:none">
          <div class="form-group">
            <label class="form-label" data-i18n="displayName">Display Name</label>
            <input class="form-input" id="regName" autocomplete="name">
          </div>
          <div class="form-group">
            <label class="form-label" data-i18n="phone">Phone</label>
            <div class="phone-field"><span class="phone-prefix">+856 20</span><input class="form-input" id="regPhone" type="tel" inputmode="numeric" maxlength="8" autocomplete="tel-local" placeholder="xxxxxxxx" oninput="this.value=this.value.replace(/\D/g,'').slice(0,8)"></div>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" data-i18n="emailLabel">Email</label>
          <input type="email" class="form-input" id="loginEmail" autocomplete="email" inputmode="email" placeholder="name@example.com">
        </div>
        <div class="form-group">
          <label class="form-label" data-i18n="password">Password</label>
          <input type="password" class="form-input" id="loginPassword" autocomplete="current-password" minlength="6">
        </div>
        <div class="form-group" id="regPasswordConfirmGroup" style="display:none">
          <label class="form-label" data-i18n="confirmPassword">Confirm password</label>
          <input type="password" class="form-input" id="regPasswordConfirm" autocomplete="new-password" minlength="6">
        </div>
        <button type="submit" class="btn-primary" id="authSubmitBtn" data-i18n="signIn">Sign in</button>
      </form>
      <button class="link-btn" id="forgotPwLink" onclick="sendPasswordReset()" data-i18n="forgotPassword">Forgot password?</button>
    </div>
  </div>
  <div id="verify-page" class="login-page" style="display:none">
    <div class="login-logo" style="font-size:56px">&#9993;&#65039;</div>
    <div class="login-title" data-i18n="verifyTitle">Confirm your email</div>
    <div class="login-subtitle"><span data-i18n="verifyText">We sent a confirmation link to</span><br><b id="verifyEmail"></b></div>
    <div class="login-form">
      <button class="btn-primary" onclick="checkVerified()" data-i18n="iVerified">I've confirmed</button>
      <button class="btn-secondary" style="margin-top:8px" onclick="resendVerification()" data-i18n="resendEmail">Resend email</button>
      <button class="link-btn" onclick="logoutUser()" data-i18n="useAnotherAccount">Use another account</button>
    </div>
  </div>
  <div id="profile-page" class="profile-setup" style="display:none">
    <h2 data-i18n="profileSetup" style="text-align:center">Set Up Profile</h2>
    <div class="form-group" style="margin-top:20px">
      <label class="form-label" data-i18n="displayName">Display Name</label>
      <input class="form-input" id="profileName">
    </div>
    <div class="form-group">
      <label class="form-label" data-i18n="phone">Phone</label>
      <div class="phone-field"><span class="phone-prefix">+856 20</span><input class="form-input" id="profilePhone" type="tel" inputmode="numeric" maxlength="8" autocomplete="tel-local" placeholder="xxxxxxxx" oninput="this.value=this.value.replace(/\D/g,'').slice(0,8)"></div>
    </div>
    <button class="btn-primary" onclick="saveProfile()" data-i18n="saveContinue">Save &amp; Continue</button>
  </div>
</div>

<!-- ==================== APP CONTAINER ==================== -->
<div id="app-container" style="display:none">

  <!-- Header -->
  <div class="app-header">
    <div class="header-top">
      <div style="display:flex;align-items:center">
        <button class="back-btn" id="backBtn" onclick="crumbBack()" style="display:none" aria-label="Back" data-i18n-aria="back">
          <span data-icon="back" data-size="22"></span>
        </button>
        <span id="headerTitle" class="header-title">Godsmash</span>
      </div>
      <div class="header-controls">
        <button class="bell-btn" onclick="toggleNotifications(event)" aria-label="Notifications" data-i18n-aria="notifications">
          <span data-icon="bell" data-size="20"></span><span class="badge" id="bellBadge" style="display:none">0</span>
        </button>
        <button class="lang-toggle" onclick="toggleLang()" id="langBtn">EN</button>
        <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">&#9728;&#65039;</button>
      </div>
    </div>
    <div class="header-sub" id="headerSub">Book &amp; split in seconds</div>
  </div>

  <!-- Content -->
  <div class="content">
    <nav class="breadcrumb" id="breadcrumb" style="display:none" aria-label="Breadcrumb" data-i18n-aria="breadcrumb"></nav>

    <!-- PAGE: Polls -->
    <div class="page" id="page-polls">
      <div id="pollsList"></div>
    </div>

    <!-- PAGE: Create Poll -->
    <div class="page" id="page-poll-create">
      <div id="pollCreateContent"></div>
    </div>

    <!-- PAGE: Sessions List -->
    <div class="page" id="page-sessions">
      <div id="sessionsList"></div>
    </div>

    <!-- PAGE: New session -->
    <div class="page" id="page-session-create">
      <div id="sessionCreateContent"></div>
    </div>

    <!-- PAGE: Session Detail -->
    <div class="page" id="page-session-detail">
      <div id="sessionDetailContent"></div>
    </div>

    <!-- PAGE: Dashboard -->
    <div class="page active" id="page-dashboard">
      <div id="dashboardContent"></div>
    </div>

    <!-- PAGE: My payments -->
    <div class="page" id="page-payments">
      <div id="paymentsContent"></div>
    </div>

    <!-- PAGE: Settings -->
    <!-- PAGE: Profile (your info, QR codes) -->
    <div class="page" id="page-profile">
      <div id="profileContent"></div>
    </div>

    <!-- PAGE: Settings (notifications, appearance, language, configuration) -->
    <div class="page" id="page-settings">
      <div id="settingsContent"></div>
    </div>

    <!-- PAGE: Recently deleted -->
    <div class="page" id="page-trash">
      <div id="trashContent"></div>
    </div>

    <!-- PAGE: Configuration (courts, cocks, players, group settings) -->
    <div class="page" id="page-config">
      <div class="dashboard-tabs" id="configTabs"></div>
      <div id="configContent"></div>
    </div>

  </div>

  <!-- Bottom Nav -->
  <div class="bottom-nav">
    <div class="nav-item" onclick="showPage('polls')" id="nav-polls">
      <span class="nav-icon" data-icon="polls" data-size="22"></span><span class="badge nav-badge" id="navBadge-polls" style="display:none">0</span>
      <span data-i18n="navPolls">Polls</span>
    </div>
    <div class="nav-item" onclick="showPage('sessions')" id="nav-sessions">
      <span class="nav-icon" data-icon="sessions" data-size="22"></span><span class="badge nav-badge" id="navBadge-sessions" style="display:none">0</span>
      <span data-i18n="navSessions">Sessions</span>
    </div>
    <div class="nav-item nav-center active" onclick="showPage('dashboard')" id="nav-dashboard">
      <span class="nav-icon" data-icon="dashboard" data-size="24"></span>
      <span data-i18n="navDashboard">Dashboard</span>
    </div>
    <div class="nav-item" onclick="showPage('profile')" id="nav-profile">
      <span class="nav-icon" data-icon="user" data-size="22"></span>
      <span data-i18n="navProfile">Profile</span>
    </div>
    <div class="nav-item" onclick="showPage('settings')" id="nav-settings">
      <span class="nav-icon" data-icon="settings" data-size="22"></span>
      <span data-i18n="navSettings">Settings</span>
    </div>
  </div>

  <!-- FAB -->
  <button class="fab-btn" id="fab" onclick="showCreatePoll()" aria-label="Create poll">+</button>

</div>

<!-- Notifications panel -->
<div class="notif-panel" id="notifPanel"></div>

<!-- Toast -->
<div class="toast" id="toast"></div>
<div class="undo-toast" id="undoToast" role="status"></div>

<!-- Modal -->
<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-card">
    <div class="modal-title" id="modalTitle"></div>
    <div id="modalBody"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()" data-i18n="cancel">Cancel</button>
      <button class="btn-primary" onclick="modalConfirm()" id="modalConfirmBtn" style="width:auto;padding:10px 20px;" data-i18n="save">Save</button>
    </div>
  </div>
</div>

<!-- ==================== SCRIPTS ==================== -->
<!-- Firebase SDK (compat) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging-compat.js"></script>


<!-- Charts -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<!-- App -->
<script src="js/firebase-config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/router.js"></script>
<script src="js/db.js"></script>
<script src="js/perms.js"></script>
<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/polls.js"></script>
<script src="js/sessions.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/settings.js"></script>
<script src="js/payments.js"></script>
<script src="js/notify.js"></script>
<script src="js/trash.js"></script>
<script src="js/push.js"></script>
<script src="js/icons.js"></script>
<script src="js/select.js"></script>
<script src="js/datepicker.js"></script>
<script src="js/app.js"></script>

</body>
</html>
