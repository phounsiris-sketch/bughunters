name: Backup (weekly)

# Copies every Firestore collection into one file, encrypts it with the
# BACKUP_PASSWORD secret and keeps it as a run artifact for 60 days.
# Restore with "Restore backup (admin)". Decrypt by hand with:
#   openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in FILE.enc -out backup.json.gz
on:
  schedule:
    - cron: "17 20 * * 0"   # Sunday 20:17 UTC = Monday 03:17 Vientiane
  workflow_dispatch:

concurrency:
  group: push-sender   # never at the same time as the push sender
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the backup password secret
        env:
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          if [ -z "$BACKUP_PASSWORD" ]; then
            echo "::error::Add a repository secret named BACKUP_PASSWORD (Settings → Secrets and variables → Actions). Backups are encrypted with it."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: push/package-lock.json
      - run: npm ci
        working-directory: push
      - run: node backup.js
        working-directory: push
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Encrypt
        working-directory: push
        env:
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          gzip -9 backup.json
          name="godsmash-backup-$(date -u +%Y-%m-%d).json.gz.enc"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:BACKUP_PASSWORD -in backup.json.gz -out "$name"
          rm -f backup.json.gz
          echo "FILE=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: godsmash-backup
          path: push/${{ env.FILE }}
          retention-days: 60
