name: Send push notifications

# Checks Firestore for new polls / bills / payments, daily payment reminders
# and "game in 1 hour" reminders, and sends web pushes.
# GitHub runs schedules best-effort (often only every few hours). For
# punctual reminders, an external cron (e.g. cron-job.org) can start this
# workflow through the API every 5-10 minutes (workflow_dispatch).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test push to every device that has notifications on"
        type: boolean
        default: false

concurrency:
  group: push-sender
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # always run the latest sender code
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: push/package-lock.json
      - run: npm ci
        working-directory: push
      - run: node send.js
        working-directory: push
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PUSH_TEST: ${{ inputs.test }}
